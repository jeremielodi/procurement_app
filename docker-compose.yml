# docker-compose.yml

services:
  # Service PostgreSQL
  postgres:
    image: postgres:16
    container_name: wwf_postgres
    restart: unless-stopped
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD : lus depuis backend/.env (identiques à DB_NAME / DB_USER / DB_PASSWORD)
    env_file: ./backend/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "5435:5432"
    networks:
      - wwf_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stockage des fichiers uploadés (pièces jointes, logos) — compatible S3
  # Bucket privé et versionné, créé par l'application au démarrage.
  # Identifiants : MINIO_ROOT_USER / MINIO_ROOT_PASSWORD dans backend/.env (comme PostgreSQL).
  # Image : MinIO ne publie plus d'images communautaires (Docker Hub / Quay) ; Chainguard la construit
  # depuis les sources officielles et la maintient à jour (image minimale, utilisateur non-root 65532).
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: wwf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: ./backend/.env
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"   # API S3 (scripts, développement local)
      - "127.0.0.1:9001:9001"   # Console web d'administration
    networks:
      - wwf_network

  # Service Application Node.js
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: wwf_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Image minimale sans outil de healthcheck : l'application réessaie la connexion au démarrage
      minio:
        condition: service_started
    env_file: ./backend/.env
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      # Server
      NODE_ENV: production
      PORT: 5000
      # JWT_SECRET / FRONTEND_URL / APP_URL (adresse publique, liens des emails) : lus depuis backend/.env (env_file)
      # Stockage des fichiers : MinIO
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD / MINIO_BUCKET : lus depuis backend/.env (env_file)
      # Ancien stockage disque : conservé pour la migration (scripts/migrate-uploads-to-minio.js)
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "5000:5000"
    networks:
      - wwf_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

# Networks
networks:
  wwf_network:
    driver: bridge
    name: wwf_network

# Volumes
volumes:
  postgres_data:
    name: wwf_postgres_data
  uploads_data:
    name: wwf_uploads_data
  minio_data:
    name: wwf_minio_data
  logs_data:
    name: wwf_logs_data